<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page to Paper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Page to Paper</h1>
      <section id="preview" hidden>
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 3.5h8.2L19 7.2V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M15 3.5V7.5h4" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <div>
          <p id="page-title"></p>
          <p id="page-host"></p>
        </div>
      </section>
      <div id="meta" class="meta" hidden>
        <div>
          <span class="label">
            <svg class="mini" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8z" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M4 8l3.2-3.5h9.6L20 8" fill="none" stroke="currentColor" stroke-width="1.6" />
            </svg>
            Destination
          </span>
          <span>Inbox</span>
        </div>
        <div>
          <span class="label">
            <svg class="mini" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 4h8.5L18 7.5V20H6V4z" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M14.5 4v4H18M8.5 12h7M8.5 15.5h7" fill="none" stroke="currentColor" stroke-width="1.6" />
            </svg>
            Format
          </span>
          <span>EPUB</span>
        </div>
      </div>
      <p id="status" role="status" aria-live="polite">Reading this page…</p>
      <p id="detail" hidden></p>
      <div class="actions">
        <button id="primary" type="button" hidden>
          <span id="spinner" class="spinner" hidden></span>
          <span id="primary-label"></span>
        </button>
        <button id="secondary" type="button" class="secondary" hidden></button>
      </div>
      <p id="footnote" class="footnote" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
