<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page to Paper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Page to Paper</h1>
      <section id="preview" hidden>
        <p id="page-title"></p>
        <p id="page-host"></p>
      </section>
      <div id="meta" class="meta" hidden>
        <div><span>Destination</span><span>Inbox</span></div>
        <div><span>Format</span><span>EPUB</span></div>
      </div>
      <p id="status" role="status" aria-live="polite">Reading this page…</p>
      <p id="detail" hidden></p>
      <div class="actions">
        <button id="primary" type="button" hidden>
          <span id="spinner" class="spinner" hidden></span>
          <span id="primary-label"></span>
        </button>
        <button id="secondary" type="button" class="secondary" hidden></button>
      </div>
      <p id="footnote" class="footnote" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
